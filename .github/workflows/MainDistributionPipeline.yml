#
# Build, test, and deploy the erpl_idoc DuckDB extension across platforms and
# DuckDB versions. Binaries are published to the erpl channel (get.erpl.io) on
# pushes to main and on version tags — same flow as erpl / erpl-web.
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main]
    tags: ['**']
    paths-ignore:
      - '**/README.md'
      - 'assets/**'
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write  # required for AWS OIDC in the deploy job
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  # Fast, DuckDB-free unit tests for the pure IDoc format core (no SAP, no vcpkg).
  core-tests:
    name: Format core unit tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Compile and run format-core tests
        run: make core_tests_format

  # ---- DuckDB 2.0 (pre-release) ----------------------------------------------
  # community-extensions builds repo.ref against this exact 2.0 commit
  # (DUCKDB_LATEST_STABLE in its build.yml); keep the SHA in step with it.
  # Build + unit tests only: no smoke test (no stock 2.0 CLI to load into)
  # and no deploy (an alpha binary only loads into that alpha).
  duckdb-next-build:
    name: Build extension binaries (v2.0 pre-release)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: d54cbbe3df17e8e5ce68312f483b4155836112aa
      ci_tools_version: v2.0-cyanoptera
      extension_name: erpl_idoc
      vcpkg_commit: 84bab45d415d22042bd0b9081aea57f362da3f35
      exclude_archs: 'windows_amd64_rtools;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads;'
      extra_extension_config: |
        if(CMAKE_CXX_COMPILER_ID STREQUAL "GNU")
          set(CMAKE_CXX_FLAGS "${CMAKE_CXX_FLAGS} -fno-gnu-unique")
        endif()

  # ---- DuckDB v1.5.6 ---------------------------------------------------------
  # vcpkg_commit: the older baseline (ce613c4) pulled msys2-runtime-3.5.4-2 for
  # openssl, which MSYS2 deleted from every mirror, so windows_amd64 was excluded
  # until this was bumped (#13). openssl is held at 3.5.0 in vcpkg.json: the
  # baseline's 3.6.0 needs Linux kernel headers the arm64 container lacks, so arm64
  # fails. Both halves are required; changing either alone turns one platform red.
  # The pin is temporary and applies to every DuckDB line (shared manifest); unpin
  # plan and exit condition: #23.
  # exclude_archs must stay identical across build/smoke-test/deploy.
  duckdb-v154-build:
    name: Build & test (v1.5.6)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5-variegata
      extension_name: erpl_idoc
      vcpkg_commit: 84bab45d415d22042bd0b9081aea57f362da3f35
      exclude_archs: 'windows_amd64_rtools;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads;'
      # GCC 14+ (the rolling ci-tools Linux image) emits STB_GNU_UNIQUE defs for
      # ODR-used DuckDB class statics, which collide with core's strong defs at link
      # (fails duckdb's own tools/plan_serializer). Apply -fno-gnu-unique globally on
      # GCC so they become weak COMDAT defs. Injected into extension_config.cmake, which
      # is include()'d at top-level scope before add_subdirectory(src/tools/extension).
      extra_extension_config: |
        if(CMAKE_CXX_COMPILER_ID STREQUAL "GNU")
          set(CMAKE_CXX_FLAGS "${CMAKE_CXX_FLAGS} -fno-gnu-unique")
        endif()

  duckdb-v154-smoke-test:
    name: Smoke test (v1.5.6)
    needs: duckdb-v154-build
    uses: ./.github/workflows/_extension_smoke_test.yml
    with:
      duckdb_version: v1.5.6
      extension_name: erpl_idoc
      exclude_archs: 'windows_amd64_rtools;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads;'

  duckdb-v154-deploy:
    name: Deploy (v1.5.6)
    needs: [duckdb-v154-build, duckdb-v154-smoke-test]
    uses: ./.github/workflows/_extension_deploy.yml
    secrets: inherit
    with:
      duckdb_version: v1.5.6
      extension_name: erpl_idoc
      exclude_archs: 'windows_amd64_rtools;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads;'
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
      # Versioned paths (erpl_idoc/vYYYY.MM.DD/...) come ONLY from the tag run. A main
      # push of the same commit builds before the tag exists (stamp vX-N-gSHA), and its
      # deploy resolves the tag at upload time: if it runs after the tag run, it
      # overwrites the release with that pre-tag build (hit duckdb-gdrive v2026.10.17).
      deploy_versioned: ${{ startsWith(github.ref, 'refs/tags/v') }}
